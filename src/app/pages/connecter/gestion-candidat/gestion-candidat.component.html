<div class="mat-elevation-z1">
  <div class="row">
    <div class="col-lg-9">
      <mat-form-field appearance="outline">
        <mat-label>Cherche Electeur</mat-label>
        <input matInput (change)="filterCandidate($event)">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
    <div class="col-lg-3">
      <button type="button" class="btn btn-outline-primary mt-3 py-3 float-end" routerLink="/connecter/add-candidate"><i class="bi bi-plus-circle"></i> Ajouter un candidat</button>
    </div>
  </div>
  <!-- Message de confirmation ou d'erreur -->
  <div *ngIf="deleteSuccess()" class="alert alert-success">
    Suppretion avec succès ! ✅
  </div>
  <table matSort mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> N° </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- firstName Column -->
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Prénom </th>
      <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
    </ng-container>

    <!-- lastName Column -->
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nom </th>
      <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
    </ng-container>

    <!-- age Column -->
    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Âge </th>
      <td mat-cell *matCellDef="let element"> {{element.age}} </td>
    </ng-container>

    <!-- occupation Column -->
    <ng-container matColumnDef="occupation">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Proffession </th>
      <td mat-cell *matCellDef="let element"> {{element.occupation}} </td>
    </ng-container>

    <!-- voterNumber Column -->
    <ng-container matColumnDef="voterNumber">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Numéro d'électeur </th>
      <td mat-cell *matCellDef="let element"> {{element.voterNumber}} </td>
    </ng-container>

    <!-- region Column -->
    <ng-container matColumnDef="voice">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Voix </th>
      <td mat-cell *matCellDef="let element"> {{element.voice}} </td>
    </ng-container>

    <!-- delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> Supprimer l'electeur </th>
      <td mat-cell *matCellDef="let element" class="text-center text-danger" (click)="deleteDialogCandidate('0ms', '0ms', element.id)"> <i class="bi bi-trash3"></i> </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;"
      (dblclick)="selectRow(row)"
      title=""
      [matTooltip]="'Double clicker pour modifier le candidate ' + row.firstName + ' ' + row.lastName"
      [matTooltipPosition]="'above'"
    ></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20, 30, 40, 50, 100]"></mat-paginator>
</div>
