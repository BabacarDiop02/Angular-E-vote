<app-menu/>
@if (authenticationService.isAuthenticated()) {
  <mat-drawer-container>
    <mat-drawer #drawer mode="side" position="start" opened="true">
      @if (authenticationService.isAuthenticated()){
        <app-sidebar-menu/>
      }
    </mat-drawer>
    <mat-drawer-content>
      <div class="p-3 overflow-y-hidden">
        <router-outlet/>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
} @else {
  <div id="non-connected">
    <router-outlet/>
  </div>
}
